<script>
(() => {
'use strict';
/* ----------------------------------------------------------- kanallar */
const KANAL = {
  almanca: { ad: 'Almanca', kanal: 'almancakafa', dosya: 'de/kelimeler.json', pdf: 'de/almancakafa_kelimeler.pdf', dil: 'Almancada', artikel: ['der', 'die', 'das'], harfEk: 'aeinrstlhgu', bayrak: ['#1E1B3A', '#E5484D', '#FFC533'] },
  ingilizce: { ad: 'İngilizce', kanal: 'ingilizce.kafa', dosya: 'en/kelimeler.json', pdf: 'en/ingilizcekafa_kelimeler.pdf', dil: 'İngilizcede', harfEk: 'aeiorstlnhd', bayrak: ['#2F6FE4', '#FFFFFF', '#E5484D'], yon: 'rows' },
  fransizca: { ad: 'Fransızca', kanal: 'fransizcakafa', dosya: 'fr/kelimeler.json', pdf: 'fr/fransizcakafa_kelimeler.pdf', dil: 'Fransızcada', artikel: ['le', 'la'], harfEk: 'aeiorstlnuc', bayrak: ['#2F6FE4', '#FFFFFF', '#E5484D'], yon: 'columns' },
  turkce: { ad: 'Turkish', kanal: 'turkish_kafa', dosya: 'tk/kelimeler.json', dil: 'in Turkish', harfEk: 'aeıiklmnrsuçşü', en: true, ayri: true }
};
const t = (tr, en) => (K && K.en ? en : tr);   // Türkçe kanalı İngilizce arayüz
const SITE = 'kafa kelime testi';
const SORU_SAYISI = 10;
/* ----------------------------------------------------------- yardımcılar */
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kucuk = (s) => s.toLocaleLowerCase('tr');
const bugun = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dun = () => { const d = new Date(); d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function rng(tohum) { let h = 1779033703 ^ tohum.length; for (let i = 0; i < tohum.length; i++) { h = Math.imul(h ^ tohum.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
const karistir = (a, r) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const depo = { oku(k, v) { try { const x = localStorage.getItem(k); return x ? JSON.parse(x) : v; } catch (e) { return v; } }, yaz(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const reel = (w) => w.reel ? 'https://www.instagram.com/reel/' + w.reel + '/' : 'https://www.instagram.com/' + K.kanal + '/';
const tamAd = (w) => (w.art ? w.art + (/'$/.test(w.art) ? '' : ' ') : '') + w.de;
const SESDIL = { almanca: 'de-DE', ingilizce: 'en-US', fransizca: 'fr-FR', turkce: 'tr-TR' };
const SESVAR = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const sesBtn = (w) => SESVAR ? `<button class="ses" type="button" data-s="${esc(tamAd(w))}" aria-label="${t('Dinle', 'Listen')}: ${esc(tamAd(w))}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>` : '';
function seslen(metin, btn) {
  if (!SESVAR) return; const dil = SESDIL[KEY] || 'en-US'; speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(metin); u.lang = dil; u.rate = 0.85;
  const v = speechSynthesis.getVoices().filter((x) => x.lang.replace('_', '-').toLowerCase().startsWith(dil.slice(0, 2).toLowerCase()));
  u.voice = v.find((x) => x.lang.replace('_', '-') === dil && /google|natural|premium|enhanced/i.test(x.name)) || v.find((x) => x.lang.replace('_', '-') === dil) || v[0] || null;

  speechSynthesis.speak(u);
}
if (SESVAR) { speechSynthesis.getVoices(); document.addEventListener('click', (e) => { const b = e.target.closest('.ses'); if (b) { e.preventDefault(); e.stopPropagation(); seslen(b.dataset.s, b); } }, true); }
const artCip = (w) => w.art ? `<span class="art ${w.art.replace(/'/g, '')}">${w.art}</span>` : '';
const bayrak = (c, yon = 'rows') => `<span class="bayrak" aria-hidden="true" style="grid-template-${yon}:1fr 1fr 1fr">${c.map((r) => `<i style="background:${r}"></i>`).join('')}</span>`;
